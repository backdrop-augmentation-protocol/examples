<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BAP Minimal Host</title>
<style>body{margin:0;background:#0c1119;color:#e9f0f8;font:15px system-ui,sans-serif}header{padding:18px 24px;border-bottom:1px solid #263547}h1{margin:0;font-size:1.2rem}.layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px;padding:16px;max-width:1100px;margin:auto}iframe{width:100%;height:480px;border:1px solid #38516d;border-radius:16px;background:#10151f}section{padding:16px;border:1px solid #263547;border-radius:12px;background:#151e2a}button{margin:4px 4px 4px 0;padding:8px 11px;border:1px solid #46617f;border-radius:7px;background:#22344a;color:inherit;cursor:pointer}label{display:block;margin:12px 0;color:#b8c7d9}select,input{margin-top:5px;padding:7px;background:#0e1621;color:inherit;border:1px solid #46617f;border-radius:6px;width:100%;box-sizing:border-box}pre{white-space:pre-wrap;color:#9cb1c9;font-size:.78rem}</style></head>
<body><header><h1>BAP Minimal Host · iframe Embedded Mode</h1></header><div class="layout"><iframe id="component" title="BAP clock component" src="../component/"></iframe><aside><section><strong>Host controls</strong><div><button id="pause">Pause</button><button id="resume">Resume</button></div><label>Locale<select id="locale"><option>en-US</option><option>zh-CN</option><option>de-DE</option></select></label><label><input id="seconds" type="checkbox" checked> Show seconds</label><button id="apply">Apply configuration</button></section><section><strong>Companion mock</strong><p id="companion">Connecting…</p><button id="load">Load config</button><button id="save">Save config</button></section><section><strong>Protocol log</strong><pre id="log"></pre></section></aside></div><script type="module" src="./host.js"></script></body></html>
