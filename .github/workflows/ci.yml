name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: examples
      - uses: actions/checkout@v6
        with:
          repository: backdrop-augmentation-protocol/spec
          ref: 334f6fee6abf14db246219a4468407373488db9c
          path: spec
      - uses: actions/checkout@v6
        with:
          repository: backdrop-augmentation-protocol/conformance
          ref: be409180718fc8762e217116d8e32c93ead918b9
          path: conformance
      - uses: actions/checkout@v6
        with:
          repository: backdrop-augmentation-protocol/companion
          ref: 365b86ca52f39bb6aa747bd06b6cba6e7c5dea89
          path: companion
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: examples/package-lock.json
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: npm ci && npm run spec:install
        working-directory: conformance
      - run: npm ci
        working-directory: examples
      - run: dotnet publish src/Companion.Server/Companion.Server.csproj --configuration Release --output artifacts/ci-server
        working-directory: companion
      - run: npm test
        working-directory: examples
        env:
          BAP_COMPANION_SERVER: ../companion/artifacts/ci-server/Bap.Companion.Server.dll
