name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: examples
      - uses: actions/checkout@v6
        with:
          repository: backdrop-augmentation-protocol/spec
          ref: 1f71aaddb3e759a634e6a4ad84958b11de27ab7b
          path: spec
      - uses: actions/checkout@v6
        with:
          repository: backdrop-augmentation-protocol/conformance
          ref: 64f0d3674de64114f063cbb6288b12278ba235a8
          path: conformance
      - uses: actions/checkout@v6
        with:
          repository: backdrop-augmentation-protocol/companion
          ref: 94d97f88448e537b9412fed6c133fcf982a0b331
          path: companion
      - uses: actions/checkout@v6
        with:
          repository: backdrop-augmentation-protocol/host-sdk
          ref: c88c04e8ffe580a1030f490cfa227a79a363a3b3
          path: host-sdk
      - uses: actions/checkout@v6
        with:
          repository: backdrop-augmentation-protocol/component-sdk
          ref: a7aa5a700638a81b7ebb0c0cf8e4d409f361ae1b
          path: component-sdk
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: examples/package-lock.json
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: npm ci && npm run build
        working-directory: host-sdk
      - run: npm ci && npm run spec:install
        working-directory: conformance
      - run: npm ci && npm install --no-save --package-lock=false ../host-sdk ../component-sdk
        working-directory: examples
      - run: dotnet publish src/Companion.Server/Companion.Server.csproj --configuration Release --output artifacts/ci-server
        working-directory: companion
      - run: npm test
        working-directory: examples
        env:
          BAP_COMPANION_SERVER: ../companion/artifacts/ci-server/Bap.Companion.Server.dll
