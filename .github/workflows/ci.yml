name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: examples
      - uses: actions/checkout@v6
        with:
          repository: backdrop-augmentation-protocol/spec
          ref: e6ddd0895d7b11d5006e393c7f23fe0c63db6ee1
          path: spec
      - uses: actions/checkout@v6
        with:
          repository: backdrop-augmentation-protocol/conformance
          ref: 3f7b7f0d9e8dee09ae1806268c395cdcb6e92169
          path: conformance
      - uses: actions/checkout@v6
        with:
          repository: backdrop-augmentation-protocol/companion
          ref: 827fb6fb97b40702dccf225bc50c0b64f341d1cb
          path: companion
      - uses: actions/checkout@v6
        with:
          repository: backdrop-augmentation-protocol/host-sdk
          ref: 12607987a8f60d5c03a27096287dd8cc38544c3b
          path: host-sdk
      - uses: actions/checkout@v6
        with:
          repository: backdrop-augmentation-protocol/component-sdk
          ref: 3c675e42fe5319341cd73c7abaeb875878ef07fe
          path: component-sdk
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: examples/package-lock.json
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: npm ci && npm run build
        working-directory: host-sdk
      - run: npm ci && npm run spec:install
        working-directory: conformance
      - run: npm ci && npm install --no-save --package-lock=false ../host-sdk ../component-sdk
        working-directory: examples
      - run: dotnet publish src/Companion.Server/Companion.Server.csproj --configuration Release --output artifacts/ci-server
        working-directory: companion
      - run: npm test
        working-directory: examples
        env:
          BAP_COMPANION_SERVER: ../companion/artifacts/ci-server/Bap.Companion.Server.dll
