name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: examples
      - uses: actions/checkout@v6
        with:
          repository: backdrop-augmentation-protocol/spec
          ref: b01f2aec715e0d31b416038ab844e862474dae6c
          path: spec
      - uses: actions/checkout@v6
        with:
          repository: backdrop-augmentation-protocol/conformance
          ref: 8d2b69ae660de300231fbf7c840d4d7dc1024960
          path: conformance
      - uses: actions/checkout@v6
        with:
          repository: backdrop-augmentation-protocol/companion
          ref: 1ac8c391e67dfd9d4cf9ddf06a0fe0009b96255b
          path: companion
      - uses: actions/checkout@v6
        with:
          repository: backdrop-augmentation-protocol/host-sdk
          ref: 62b22251629be8e0c32aa1a6caff3996ef510008
          path: host-sdk
      - uses: actions/checkout@v6
        with:
          repository: backdrop-augmentation-protocol/component-sdk
          ref: 1f69f30f629d355f32fc75aadceb67b68a40ea66
          path: component-sdk
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: examples/package-lock.json
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: npm ci && npm run build
        working-directory: host-sdk
      - run: npm ci && npm run spec:install
        working-directory: conformance
      - run: npm ci && npm install --no-save --package-lock=false ../host-sdk ../component-sdk
        working-directory: examples
      - run: dotnet publish src/Companion.Server/Companion.Server.csproj --configuration Release --output artifacts/ci-server
        working-directory: companion
      - run: npm test
        working-directory: examples
        env:
          BAP_COMPANION_SERVER: ../companion/artifacts/ci-server/Bap.Companion.Server.dll
