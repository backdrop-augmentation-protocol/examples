name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: examples
      - uses: actions/checkout@v6
        with:
          repository: backdrop-augmentation-protocol/spec
          ref: fc372322a72741c52db6fd3fa7ad62eb47443c8b
          path: spec
      - uses: actions/checkout@v6
        with:
          repository: backdrop-augmentation-protocol/host-sdk
          ref: 15c7d67edb89979e6f60b35e1ad8fa4c4321b7c8
          path: host-sdk
      - uses: actions/checkout@v6
        with:
          repository: backdrop-augmentation-protocol/component-sdk
          ref: ffa6e7d2d3daecf1b2ddcce2f9aca78a90c46c56
          path: component-sdk
      - uses: actions/checkout@v6
        with:
          repository: backdrop-augmentation-protocol/conformance
          ref: 792bb10f69b1cb85031e7be4d020908ac8e99a8f
          path: conformance
      - uses: actions/checkout@v6
        with:
          repository: backdrop-augmentation-protocol/companion
          ref: a2db36d175ab1f563f36a5413914ddcae2ccd835
          path: companion
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: examples/package-lock.json
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: npm ci && npm run build
        working-directory: host-sdk
      - run: npm ci && npm run spec:install
        working-directory: conformance
      - run: npm ci
        working-directory: examples
      - run: dotnet publish src/Companion.Server/Companion.Server.csproj --configuration Release --output artifacts/ci-server
        working-directory: companion
      - run: npm test
        working-directory: examples
        env:
          BAP_COMPANION_SERVER: ../companion/artifacts/ci-server/Bap.Companion.Server.dll
