<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BAP Host Wallpaper Demo</title>
<style>
html,body,#app{width:100%;height:100%;margin:0;overflow:hidden;background:#07111d;color:#fff;font-family:system-ui,sans-serif}
#video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;background:#07111d}
#shade{position:fixed;inset:0;background:linear-gradient(90deg,#06111dcc,transparent 55%,#06111d55);z-index:1;pointer-events:none}
.component{position:fixed;z-index:2;pointer-events:none}
#component-time{left:4vw;bottom:6vh;width:min(560px,42vw);height:min(240px,22vh)}
#component-calendar{right:4vw;top:6vh;width:min(340px,30vw);height:370px}
.component iframe{width:100%;height:100%;border:0;background:transparent}
#component-calendar iframe{pointer-events:auto}
#controls{position:fixed;right:22px;bottom:18px;z-index:4;opacity:.25;transition:opacity .2s}#controls:hover{opacity:1}
#companion-status{position:fixed;left:22px;top:18px;z-index:4;color:#d8f2ff;background:#07111dcc;padding:6px 10px;border:1px solid #47718e;border-radius:6px;font:12px system-ui,sans-serif}
button,input{accent-color:#7dc8ff}button{background:#14283b;color:#fff;border:1px solid #47718e;border-radius:6px;padding:6px 10px}
</style></head>
<body><div id="app"><video id="video" autoplay loop muted playsinline></video><div id="shade"></div><div id="component-time" class="component"></div><div id="component-calendar" class="component"></div><div id="controls"><button id="toggle">Unmute</button><label>Volume <input id="volume" type="range" min="0" max="1" step="0.05" value="0.35"></label></div></div>
<div id="companion-status">Companion: connecting...</div><script type="module" src="./main.js"></script></body></html>
