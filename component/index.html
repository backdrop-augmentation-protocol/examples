<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BAP Clock Component</title>
  <style>
    :root { color-scheme: dark; font: 16px system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at top, #263b59, #10151f 70%); color: #f4f7fb; }
    main { width: min(560px, 88vw); padding: 28px; border: 1px solid #48617e; border-radius: 18px; background: #172232d9; box-shadow: 0 20px 60px #0006; }
    h1 { margin: 0 0 8px; font-size: 1.1rem; font-weight: 600; color: #a9c9f4; }
    #clock { font-size: clamp(3rem, 12vw, 6rem); letter-spacing: .04em; font-variant-numeric: tabular-nums; }
    #status { color: #b8c7d9; min-height: 1.5em; } .pill { color: #8fe3b0; }
  </style>
</head>
<body><main><h1>BAP Clock / Status Component <span class="pill" id="mode"></span></h1><div id="clock">--:--:--</div><div id="status">Booting…</div></main><script type="module" src="./component.js"></script></body>
</html>
