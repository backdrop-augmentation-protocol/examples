<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BAP Embedded Time Widget</title><style>html,body,#root{width:100%;height:100%;margin:0;background:transparent;overflow:hidden}body{color:#fff;font-family:"Segoe UI",system-ui,sans-serif}.card{position:absolute;left:0;bottom:0;text-shadow:0 3px 15px #000}.time{font-size:clamp(48px,10vw,120px);font-weight:200;letter-spacing:.03em;line-height:.95;font-variant-numeric:tabular-nums}.date{font-size:clamp(16px,2vw,26px);font-weight:300;opacity:.9;margin-top:12px}.badge{font-size:11px;letter-spacing:.18em;text-transform:uppercase;opacity:.65;margin-bottom:8px}</style></head><body><main id="root"><div class="card"><div class="badge">BAP TIME WIDGET</div><div class="time" id="time">--:--</div><div class="date" id="date">Loading</div></div></main><script type="module" src="./main.js"></script></body></html>
