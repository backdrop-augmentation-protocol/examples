<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BAP Time Widget</title>
<style>html,body,#root{width:100%;height:100%;margin:0}body{background:#101820 url('../assets/time-widget/river-sunset.jpg') center/cover no-repeat;color:#fff;font-family:"Segoe UI",system-ui,sans-serif}.embedded body{background:transparent}.embedded #root{background:transparent}.card{position:absolute;left:5vw;bottom:8vh;text-shadow:0 3px 15px #000}.time{font-size:clamp(64px,10vw,150px);font-weight:200;letter-spacing:.03em;line-height:.95;font-variant-numeric:tabular-nums}.date{font-size:clamp(18px,2vw,30px);font-weight:300;opacity:.9;margin-top:16px}.badge{font-size:12px;letter-spacing:.18em;text-transform:uppercase;opacity:.65;margin-bottom:10px}</style></head><body><main id="root"><div class="card"><div class="badge">BAP TIME WIDGET</div><div class="time" id="time">--:--</div><div class="date" id="date">Loading</div></div></main><script type="module" src="./main.js"></script></body></html>
