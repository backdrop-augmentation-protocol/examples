<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BAP Embedded Calendar Widget</title>
  <style>
    html, body, #root { width: 100%; height: 100%; margin: 0; background: transparent; overflow: hidden; }
    body { color: #f7f4e9; font-family: "Segoe UI", system-ui, sans-serif; }
    .calendar { box-sizing: border-box; display: flex; flex-direction: column; width: 100%; height: 100%; max-height: 100%; overflow: hidden; margin-left: auto; padding: 20px; border: 1px solid #ffffff4d; border-radius: 20px; background: #10283cdd; box-shadow: 0 12px 36px #0009; }
    .topline { display: flex; justify-content: space-between; align-items: center; }
    .eyebrow { font-size: 10px; letter-spacing: .23em; color: #9bd9e4; }
    .collapse { cursor: pointer; border: 1px solid #ffffff55; border-radius: 8px; background: #ffffff16; color: #f7f4e9; padding: 5px 9px; font: 12px "Segoe UI", system-ui, sans-serif; }
    .collapse:hover, .collapse:focus-visible { background: #ffffff35; }
    .heading { display: flex; justify-content: space-between; align-items: baseline; margin: 10px 0 16px; }
    .month { font-size: 23px; font-weight: 500; }
    .year { font-size: 14px; color: #bad1dc; }
    .grid { display: grid; flex: 1 1 auto; min-height: 0; grid-template-columns: repeat(7, 1fr); grid-template-rows: repeat(7, minmax(0, 1fr)); gap: 5px; text-align: center; }
    .grid[hidden] { display: none; }
    .weekday { font-size: 10px; color: #a5bdc8; padding-bottom: 5px; }
    .day { display: grid; place-items: center; min-height: 0; font-size: 12px; border-radius: 50%; }
    .outside { opacity: .3; }
    .today { background: #ffe2a3; color: #172532; font-weight: 700; }
    @media (max-height: 420px) {
      .calendar { height: 100%; padding: clamp(3px, 1.5vh, 9px); border-radius: 12px; }
      .collapse { padding: 2px 5px; }
      .heading { margin: clamp(2px, 1.5vh, 7px) 0; }
      .grid { gap: clamp(1px, .8vh, 3px); }
      .weekday { padding-bottom: clamp(0px, .6vh, 3px); }
      .day { height: clamp(8px, calc((100vh - 94px) / 6), 18px); }
    }
  </style>
</head>
<body>
  <main id="root">
    <section class="calendar" aria-label="Calendar">
      <div class="topline">
        <div class="eyebrow">BAP CALENDAR</div>
        <button class="collapse" id="toggle-calendar" type="button" aria-controls="grid" aria-expanded="true" aria-label="Collapse calendar">Collapse</button>
      </div>
      <div class="heading"><span class="month" id="month">Loading</span><span class="year" id="year"></span></div>
      <div class="grid" id="grid"></div>
    </section>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
