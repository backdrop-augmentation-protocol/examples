<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BAP Embedded Calendar Widget</title>
<style>html,body,#root{width:100%;height:100%;margin:0;background:transparent}body{color:#f7f4e9;font-family:"Segoe UI",system-ui,sans-serif}.calendar{box-sizing:border-box;width:min(100%,340px);margin-left:auto;padding:20px;border:1px solid #ffffff4d;border-radius:20px;background:#10283cdd;box-shadow:0 12px 36px #0009}.eyebrow{font-size:10px;letter-spacing:.23em;color:#9bd9e4}.heading{display:flex;justify-content:space-between;align-items:baseline;margin:10px 0 16px}.month{font-size:23px;font-weight:500}.year{font-size:14px;color:#bad1dc}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}.weekday{font-size:10px;color:#a5bdc8;padding-bottom:5px}.day{display:grid;place-items:center;height:28px;font-size:12px;border-radius:50%}.outside{opacity:.3}.today{background:#ffe2a3;color:#172532;font-weight:700}</style></head><body><main id="root"><section class="calendar" aria-label="Calendar"><div class="eyebrow">BAP CALENDAR</div><div class="heading"><span class="month" id="month">Loading</span><span class="year" id="year"></span></div><div class="grid" id="grid"></div></section></main><script type="module" src="./main.js"></script></body></html>
