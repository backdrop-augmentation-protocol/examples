<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BAP Calendar Widget</title>
<style>html,body,#root{width:100%;height:100%;margin:0}body{display:grid;place-items:center;background:radial-gradient(circle at 75% 20%,#426c8c,#102a43 48%,#081824);color:#f7f4e9;font-family:"Segoe UI",system-ui,sans-serif}.calendar{width:min(360px,calc(100vw - 48px));box-sizing:border-box;padding:24px;border:1px solid #ffffff4d;border-radius:24px;background:#10283cd9;box-shadow:0 18px 48px #0008}.eyebrow{font-size:11px;letter-spacing:.24em;color:#9bd9e4}.heading{display:flex;justify-content:space-between;align-items:baseline;margin:12px 0 20px}.month{font-size:25px;font-weight:500}.year{font-size:16px;color:#bad1dc}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;text-align:center}.weekday{font-size:11px;color:#a5bdc8;padding-bottom:7px}.day{display:grid;place-items:center;height:32px;font-size:14px;border-radius:50%}.outside{opacity:.3}.today{background:#ffe2a3;color:#172532;font-weight:700}</style></head><body><main id="root"><section class="calendar" aria-label="Calendar"><div class="eyebrow">BAP CALENDAR</div><div class="heading"><span class="month" id="month">Loading</span><span class="year" id="year"></span></div><div class="grid" id="grid"></div></section></main><script type="module" src="./main.js"></script></body></html>
